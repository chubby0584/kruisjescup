<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SC Rheden Jeugd</title>
<meta name="theme-color" content="#ba2017">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root{
    --brand:#ba2017;
    --brand-dark:#8e1811;
    --brand-tint:#fbe6e4;
    --ink:#1d1d1b;
    --bg:#f2f4f2;
    --card:#ffffff;
    --border:#e2e6e2;
    --text:#1a1a1a;
    --muted:#6b6f6b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    flex-direction:column;
  }
  .hero{
    background:linear-gradient(160deg, var(--brand) 0%, var(--brand-dark) 100%);
    border-bottom:5px solid var(--ink);
    padding:40px 20px 34px;
    text-align:center;
    color:#fff;
  }
  @keyframes logoPop{
    0%{transform:scale(.6) rotate(-8deg); opacity:0;}
    60%{transform:scale(1.08) rotate(3deg); opacity:1;}
    100%{transform:scale(1) rotate(0deg); opacity:1;}
  }
  .hero img{
    width:132px;
    max-width:52vw;
    height:auto;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));
    animation:logoPop .6s cubic-bezier(.34,1.56,.64,1) both;
  }
  .hero h1{
    margin:16px 0 0;
    font-size:1.5rem;
    letter-spacing:-.02em;
  }
  .hero p{
    margin:6px 0 0;
    font-size:.88rem;
    opacity:.92;
  }
  main{
    flex:1;
    width:100%;
    max-width:460px;
    margin:0 auto;
    padding:24px 20px 8px;
  }
  h2{
    font-size:.75rem;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:var(--muted);
    margin:0 4px 12px;
    font-weight:800;
  }
  .team-btn{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px 18px;
    margin-bottom:12px;
    text-decoration:none;
    color:var(--text);
    box-shadow:0 1px 3px rgba(0,0,0,.05);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .team-btn:active{transform:scale(.985);box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .team-btn .badge{
    width:52px;
    height:52px;
    border-radius:50%;
    background:var(--brand);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:1.25rem;
    flex:0 0 auto;
    letter-spacing:-.02em;
  }
  .team-btn .txt{flex:1;min-width:0;}
  .team-btn .name{
    display:block;
    font-size:1.15rem;
    font-weight:800;
    letter-spacing:-.01em;
  }
  .team-btn .sub{
    display:block;
    font-size:.82rem;
    color:var(--muted);
    margin-top:2px;
  }
  .team-btn .chev{
    color:var(--brand);
    font-size:1.4rem;
    font-weight:700;
    flex:0 0 auto;
  }
  .soon{
    text-align:center;
    color:var(--muted);
    font-size:.82rem;
    padding:10px 4px 0;
  }
  footer{
    text-align:center;
    padding:22px 16px 30px;
    font-size:.75rem;
    color:var(--muted);
  }
  footer a{color:var(--muted);}
</style>
</head>
<body>

<div class="hero">
  <img src="icons/club-logo.png" alt="SC Rheden">
  <h1>SC Rheden Jeugd</h1>
  <p>Standen, trainingen en wedstrijden</p>
</div>

<main>
  <h2>Teams</h2>

  <a class="team-btn" href="o17-1.html">
    <span class="badge">17</span>
    <span class="txt">
      <span class="name">O17-1</span>
      <span class="sub">Kruisjescup, trainingen &amp; wedstrijden</span>
    </span>
    <span class="chev">›</span>
  </a>

  <p class="soon">Meer teams volgen later.</p>
</main>

<footer>
  SC Rheden · <a href="beheer.html">Trainer</a>
</footer>

</body>
</html>
