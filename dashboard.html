<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Kruisjescup JO17 — Dashboard</title>
<meta name="theme-color" content="#ba2017">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root{
    --brand:#ba2017;
    --brand-dark:#8e1811;
    --brand-tint:#fbe6e4;
    --ink:#1d1d1b;
    --bg:#f2f4f2;
    --card:#ffffff;
    --border:#e2e6e2;
    --text:#1a1a1a;
    --muted:#6b6f6b;
    --gold:#d4a017;
    --silver:#9aa3ab;
    --bronze:#c2763a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
  }

  /* ---------------- Header ---------------- */
  @keyframes logoPop{
    0%{transform:scale(.6) rotate(-8deg); opacity:0;}
    60%{transform:scale(1.08) rotate(3deg); opacity:1;}
    100%{transform:scale(1) rotate(0deg); opacity:1;}
  }
  header{
    background:linear-gradient(160deg, var(--brand) 0%, var(--brand-dark) 100%);
    color:#fff;
    padding:18px 16px 16px;
    border-bottom:5px solid var(--ink);
    position:relative;
    overflow:hidden;
  }
  .header-inner{
    max-width:640px;
    margin:0 auto;
    position:relative;
    z-index:1;
  }
  header h1{
    margin:0;
    font-size:1.45rem;
    letter-spacing:-.02em;
    display:flex;
    align-items:center;
    gap:10px;
  }
  header h1 .club-logo{
    height:46px;
    width:auto;
    display:block;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.3));
    animation:logoPop .6s cubic-bezier(.34,1.56,.64,1) both;
  }
  .season-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:14px;
    font-size:.85rem;
  }
  header select{
    background:rgba(255,255,255,.18);
    color:#fff;
    border:1px solid rgba(255,255,255,.45);
    border-radius:8px;
    padding:5px 9px;
    font-size:.85rem;
    font-weight:600;
  }
  header select option{color:#000;}

  main{max-width:640px;margin:0 auto;padding:16px;}

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px;
    margin-bottom:16px;
    box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .card h2{
    margin:0 0 14px;
    font-size:1.1rem;
    color:var(--ink);
    letter-spacing:-.01em;
  }

  /* ---------------- Koploper hero ---------------- */
  @keyframes heroIn{
    from{opacity:0; transform:scale(.94);}
    to{opacity:1; transform:scale(1);}
  }
  @keyframes shine{
    0%{transform:translateX(-120%) rotate(20deg);}
    100%{transform:translateX(320%) rotate(20deg);}
  }
  .hero{
    background:linear-gradient(150deg,#2a2a28 0%, #16160f 100%);
    border-radius:18px;
    padding:22px 20px;
    margin-bottom:16px;
    color:#fff;
    text-align:center;
    position:relative;
    overflow:hidden;
    border:2px solid var(--gold);
    box-shadow:0 6px 22px rgba(0,0,0,.22);
    animation:heroIn .5s cubic-bezier(.34,1.4,.64,1) both;
  }
  .hero::after{
    content:"";
    position:absolute;
    top:-40%;
    left:0;
    width:60px;
    height:190%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);
    animation:shine 4.5s ease-in-out 1s infinite;
  }
  .hero .crown{font-size:2.4rem;line-height:1;display:block;}
  .hero .label{
    display:inline-block;
    margin-top:8px;
    font-size:.7rem;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:800;
  }
  .hero .leader-name{
    margin:6px 0 0;
    font-size:1.75rem;
    font-weight:800;
    letter-spacing:-.02em;
    line-height:1.15;
  }
  .hero .leader-count{
    margin-top:10px;
    font-size:.95rem;
    color:#e8e2cf;
  }
  .hero .leader-count b{
    font-size:1.35rem;
    color:var(--gold);
    vertical-align:-1px;
  }
  .hero .prize{
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid rgba(255,255,255,.14);
    font-size:.78rem;
    color:#bdb8a8;
  }

  /* ---------------- Podium ---------------- */
  .podium{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    align-items:end;
    margin-bottom:6px;
  }
  .podium-col{text-align:center;min-width:0;}
  .podium-avatar{
    width:46px;
    height:46px;
    border-radius:50%;
    margin:0 auto 6px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:.95rem;
    color:#fff;
    box-shadow:0 2px 6px rgba(0,0,0,.16);
  }
  .podium-name{
    font-size:.76rem;
    font-weight:700;
    line-height:1.2;
    margin-bottom:6px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .podium-block{
    border-radius:10px 10px 0 0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding-top:8px;
    color:#fff;
    font-weight:800;
  }
  .podium-block .medal{font-size:1.1rem;line-height:1;}
  .podium-block .count{font-size:1.45rem;line-height:1.05;margin-top:3px;}
  .podium-block .count small{font-size:.58rem;font-weight:600;opacity:.9;display:block;line-height:1.1;margin-top:1px;}
  .p1 .podium-block{height:116px;background:linear-gradient(180deg,#e8bd3d,#c99512);}
  .p2 .podium-block{height:98px;background:linear-gradient(180deg,#b6bec6,#8e979f);}
  .p3 .podium-block{height:86px;background:linear-gradient(180deg,#d08a52,#ab6630);}
  .p1 .podium-avatar{border:3px solid var(--gold);}
  .p2 .podium-avatar{border:3px solid var(--silver);}
  .p3 .podium-avatar{border:3px solid var(--bronze);}

  /* ---------------- Rest of standings ---------------- */
  .standings{list-style:none;margin:14px 0 0;padding:0;}
  .standings li{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 4px;
    border-bottom:1px solid var(--border);
  }
  .standings li:last-child{border-bottom:none;}
  .standings .rank{width:22px;font-weight:800;color:var(--muted);font-size:.9rem;}
  .avatar{
    width:30px;
    height:30px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:.72rem;
    font-weight:800;
    flex:0 0 auto;
  }
  .standings .name{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .standings .score{
    font-weight:800;
    color:var(--brand);
    background:var(--brand-tint);
    border-radius:999px;
    padding:3px 11px;
    font-size:.85rem;
  }

  /* ---------------- Stats ---------------- */
  .stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
  }
  .stat{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 8px;
    text-align:center;
    box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .stat .num{
    font-size:1.5rem;
    font-weight:800;
    color:var(--brand);
    line-height:1.1;
  }
  .stat .lbl{
    font-size:.7rem;
    color:var(--muted);
    margin-top:2px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.04em;
  }

  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:10px;
    padding:12px 16px;
    font-size:.95rem;
    font-weight:700;
  }
  .btn-secondary{background:#eceeec;color:var(--text);}
  .empty{color:var(--muted);font-size:.9rem;text-align:center;padding:20px 0;}

  /* ---------------- Feed ---------------- */
  @keyframes fadeInUp{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  .post{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    margin-bottom:14px;
    overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.05);
    animation:fadeInUp .4s ease both;
  }
  .post-head{
    display:flex;
    align-items:center;
    gap:10px;
    padding:13px 15px;
  }
  .post-icon{
    width:38px;
    height:38px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.1rem;
    flex:0 0 auto;
    background:var(--brand-tint);
  }
  .post-icon.match{background:#e4ecf6;}
  .post-when{font-weight:800;font-size:.98rem;line-height:1.2;}
  .post-date{font-size:.74rem;color:var(--muted);margin-top:1px;}
  .post-body{padding:0 15px 13px;}
  .post-body.no-photo{padding-bottom:15px;}
  .winners-label{
    font-size:.72rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--muted);
    margin-bottom:6px;
  }
  .winner-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--brand-tint);
    color:var(--brand);
    border-radius:999px;
    padding:5px 12px 5px 5px;
    font-size:.86rem;
    font-weight:700;
    margin:3px 5px 3px 0;
  }
  .winner-badge .avatar{width:24px;height:24px;font-size:.62rem;}
  .match-line{
    font-weight:800;
    font-size:1.05rem;
    color:var(--ink);
  }
  .match-line .score{
    color:var(--brand);
    background:var(--brand-tint);
    border-radius:8px;
    padding:1px 9px;
    margin-left:4px;
  }
  .story{
    margin-top:10px;
    background:#fbf8f0;
    border-left:3px solid var(--gold);
    border-radius:0 10px 10px 0;
    padding:10px 12px;
    font-size:.89rem;
    color:#584f3f;
    font-style:italic;
    line-height:1.45;
  }
  .post img{
    width:100%;
    max-height:420px;
    object-fit:cover;
    display:block;
    background:#eee;
  }
  .season-badge{
    display:inline-block;
    background:var(--brand-tint);
    color:var(--brand);
    border-radius:999px;
    padding:3px 11px;
    font-size:.75rem;
    font-weight:700;
    margin-bottom:10px;
  }
  .section-title{
    margin:22px 4px 12px;
    font-size:1.1rem;
    font-weight:800;
    color:var(--ink);
    letter-spacing:-.01em;
  }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:.75rem;
    padding:12px 16px 36px;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1><img src="icons/club-logo.png" alt="SC Rheden" class="club-logo">SC Rheden O17-1</h1>
    <div class="season-row">
      <span>Seizoen</span>
      <select id="seasonSelect"></select>
    </div>
  </div>
</header>

<main>

  <div id="heroWrap"></div>

  <div class="stats" id="statsRow"></div>

  <div class="card" style="margin-top:16px;">
    <span class="season-badge" id="standSeasonBadge"></span>
    <h2>🏆 Stand</h2>
    <div class="podium" id="podium"></div>
    <ul class="standings" id="standingsList"></ul>
    <p class="empty" id="standingsEmpty" style="display:none;">Nog geen kruisjes dit seizoen — de cup is nog helemaal open!</p>
    <button class="btn-secondary" id="standingsToggleBtn" style="width:100%;margin-top:14px;display:none;"></button>
  </div>

  <h2 class="section-title">📸 Trainingen &amp; wedstrijden</h2>
  <div id="feedList"></div>
  <p class="empty" id="feedEmpty" style="display:none;">Nog niets geregistreerd dit seizoen.</p>
  <button class="btn-secondary" id="feedMoreBtn" style="width:100%;display:none;">Meer laden</button>

</main>

<footer>Kruisjescup JO17 · SC Rheden</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

(function(){
  "use strict";

  function fromIso(s){ return new Date(s + "T00:00:00"); }
  function seasonForDate(iso){
    const date = fromIso(iso);
    const y = date.getFullYear();
    const m = date.getMonth();
    return m >= 6 ? (y + "/" + (y+1)) : ((y-1) + "/" + y);
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function relativeDate(iso){
    const today = new Date();
    today.setHours(0,0,0,0);
    const diffDays = Math.round((today - fromIso(iso)) / 86400000);
    if(diffDays === 0) return "Vandaag";
    if(diffDays === 1) return "Gisteren";
    if(diffDays > 1 && diffDays <= 6) return diffDays + " dagen geleden";
    if(diffDays < 0) return "Binnenkort";
    return null;
  }
  function initials(name){
    const parts = String(name).trim().split(/\s+/).filter(w=>w.length>2 || /^[A-Z]/.test(w));
    const first = parts[0] || name;
    const last = parts.length > 1 ? parts[parts.length-1] : "";
    return ((first[0]||"") + (last[0]||"")).toUpperCase();
  }
  // Vaste kleur per speler, afgeleid van de naam.
  function avatarColor(name){
    let h = 0;
    for(let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) % 360;
    return "hsl(" + h + ",52%,42%)";
  }
  function avatarHtml(name, cls){
    return '<span class="avatar ' + (cls||"") + '" style="background:' + avatarColor(name) + '">' +
      escapeHtml(initials(name)) + '</span>';
  }

  let data = { players: [], entries: [] };
  let activeSeason = seasonForDate(
    (()=>{ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); })()
  );

  const seasonSelect = document.getElementById("seasonSelect");
  function allSeasons(){
    const set = new Set(data.entries.map(e=>e.season));
    set.add(activeSeason);
    return Array.from(set).sort().reverse();
  }
  function renderSeasonSelect(){
    const seasons = allSeasons();
    seasonSelect.innerHTML = "";
    seasons.forEach(s=>{
      const opt = document.createElement("option");
      opt.value = s; opt.textContent = s;
      if(s === activeSeason) opt.selected = true;
      seasonSelect.appendChild(opt);
    });
    document.getElementById("standSeasonBadge").textContent = "Seizoen " + activeSeason;
  }
  seasonSelect.addEventListener("change", ()=>{
    activeSeason = seasonSelect.value;
    standingsExpanded = false;
    feedVisibleCount = FEED_PAGE_SIZE;
    renderAll();
  });

  function playerName(id){
    const p = data.players.find(p=>p.id===id);
    return p ? p.name : "(verwijderde speler)";
  }
  function seasonEntries(){
    return data.entries.filter(e=>e.season===activeSeason);
  }
  function seasonCounts(){
    const counts = {};
    seasonEntries().forEach(e=>{
      (e.playerIds||[]).forEach(pid=>{ counts[pid] = (counts[pid]||0) + 1; });
    });
    return counts;
  }
  function rankedRows(){
    const counts = seasonCounts();
    return data.players
      .map(p => ({ id:p.id, name:p.name, count: counts[p.id]||0 }))
      .filter(r => r.count > 0)
      .sort((a,b)=> b.count - a.count || a.name.localeCompare(b.name));
  }

  // ---------- Koploper hero ----------
  function renderHero(){
    const rows = rankedRows();
    const wrap = document.getElementById("heroWrap");
    if(rows.length === 0){ wrap.innerHTML = ""; return; }

    const top = rows[0].count;
    const leaders = rows.filter(r=>r.count === top);
    const names = leaders.map(r=>escapeHtml(r.name)).join(" & ");
    const label = leaders.length > 1 ? "Gedeelde koppositie" : "Koploper";

    wrap.innerHTML =
      '<div class="hero">' +
        '<span class="crown">👑</span>' +
        '<span class="label">' + label + '</span>' +
        '<p class="leader-name">' + names + '</p>' +
        '<div class="leader-count"><b>' + top + '</b> ' + (top === 1 ? "kruisje" : "kruisjes") + '</div>' +
        '<div class="prize">Speelt om de schoenenbon t.w.v. €100 👟</div>' +
      '</div>';
  }

  // ---------- Stats ----------
  function renderStats(){
    const entries = seasonEntries();
    const trainingen = entries.filter(e=>e.type !== "wedstrijd").length;
    const wedstrijden = entries.filter(e=>e.type === "wedstrijd").length;
    const kruisjes = entries.reduce((sum,e)=> sum + (e.playerIds||[]).length, 0);
    const row = document.getElementById("statsRow");
    row.innerHTML =
      '<div class="stat"><div class="num">' + kruisjes + '</div><div class="lbl">Kruisjes</div></div>' +
      '<div class="stat"><div class="num">' + trainingen + '</div><div class="lbl">Trainingen</div></div>' +
      '<div class="stat"><div class="num">' + wedstrijden + '</div><div class="lbl">Wedstrijden</div></div>';
    row.style.display = entries.length ? "grid" : "none";
  }

  // ---------- Podium + lijst ----------
  const STANDINGS_REST_N = 4;
  let standingsExpanded = false;
  const standingsToggleBtn = document.getElementById("standingsToggleBtn");
  standingsToggleBtn.addEventListener("click", ()=>{
    standingsExpanded = !standingsExpanded;
    renderStandings();
  });

  function renderStandings(){
    const rows = rankedRows();
    const podium = document.getElementById("podium");
    const list = document.getElementById("standingsList");
    document.getElementById("standingsEmpty").style.display = rows.length ? "none" : "block";

    // Podium: plaats 2 links, 1 midden, 3 rechts.
    const top3 = rows.slice(0,3);
    if(top3.length === 0){
      podium.style.display = "none";
    } else {
      podium.style.display = "grid";
      const order = [1,0,2]; // index in top3 -> kolomvolgorde
      const medals = ["🥇","🥈","🥉"];
      podium.innerHTML = order.map(idx=>{
        const r = top3[idx];
        if(!r) return '<div class="podium-col"></div>';
        return '<div class="podium-col p' + (idx+1) + '">' +
          avatarHtml(r.name, "podium-avatar") +
          '<div class="podium-name">' + escapeHtml(r.name) + '</div>' +
          '<div class="podium-block">' +
            '<span class="medal">' + medals[idx] + '</span>' +
            '<span class="count">' + r.count + '<small>' + (r.count === 1 ? "kruisje" : "kruisjes") + '</small></span>' +
          '</div>' +
        '</div>';
      }).join("");
    }

    // Overige spelers onder het podium.
    const rest = rows.slice(3);
    const visibleRest = standingsExpanded ? rest : rest.slice(0, STANDINGS_REST_N);
    list.innerHTML = visibleRest.map((r,i)=>
      '<li><span class="rank">' + (i+4) + '</span>' +
      avatarHtml(r.name) +
      '<span class="name">' + escapeHtml(r.name) + '</span>' +
      '<span class="score">' + r.count + '</span></li>'
    ).join("");

    if(rest.length > STANDINGS_REST_N){
      standingsToggleBtn.style.display = "block";
      standingsToggleBtn.textContent = standingsExpanded
        ? "Toon minder"
        : "Bekijk hele lijst (" + rows.length + " spelers)";
    } else {
      standingsToggleBtn.style.display = "none";
    }
  }

  // ---------- Feed ----------
  const FEED_PAGE_SIZE = 6;
  let feedVisibleCount = FEED_PAGE_SIZE;
  const feedMoreBtn = document.getElementById("feedMoreBtn");
  feedMoreBtn.addEventListener("click", ()=>{
    feedVisibleCount += FEED_PAGE_SIZE;
    renderFeed();
  });

  function renderFeed(){
    const entries = seasonEntries().sort((a,b)=> b.date.localeCompare(a.date));
    const container = document.getElementById("feedList");
    container.innerHTML = "";
    document.getElementById("feedEmpty").style.display = entries.length ? "none" : "block";

    entries.slice(0, feedVisibleCount).forEach((e,i)=>{
      const div = document.createElement("div");
      div.className = "post";
      div.style.animationDelay = Math.min(i * 0.05, 0.4) + "s";

      const isWedstrijd = e.type === "wedstrijd";
      const dateFormatted = fromIso(e.date).toLocaleDateString("nl-NL", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
      const rel = relativeDate(e.date);
      const icon = isWedstrijd ? "⚽" : "🎯";

      let bodyHtml;
      if(isWedstrijd){
        const opponent = e.opponent ? escapeHtml(e.opponent) : "Wedstrijd";
        const scoreHtml = e.score ? '<span class="score">' + escapeHtml(e.score) + '</span>' : '';
        bodyHtml = '<div class="match-line">vs ' + opponent + scoreHtml + '</div>';
      } else {
        const ids = e.playerIds || [];
        const label = ids.length === 1 ? "Winnaar van deze training" : "Winnaars van deze training";
        bodyHtml = (ids.length ? '<div class="winners-label">' + label + '</div>' : '') +
          '<div>' + ids.map(id=>{
            const n = playerName(id);
            return '<span class="winner-badge">' + avatarHtml(n) + escapeHtml(n) + '</span>';
          }).join("") + '</div>';
      }

      div.innerHTML =
        '<div class="post-head">' +
          '<span class="post-icon' + (isWedstrijd ? " match" : "") + '">' + icon + '</span>' +
          '<div><div class="post-when">' + (rel || dateFormatted) + '</div>' +
          (rel ? '<div class="post-date">' + dateFormatted + '</div>' : '') + '</div>' +
        '</div>' +
        '<div class="post-body' + (e.photo ? "" : " no-photo") + '">' +
          bodyHtml +
          (e.note ? '<div class="story">' + escapeHtml(e.note) + '</div>' : '') +
        '</div>' +
        (e.photo ? '<img src="' + e.photo + '" loading="lazy" alt="">' : '');

      container.appendChild(div);
    });

    feedMoreBtn.style.display = entries.length > feedVisibleCount ? "block" : "none";
  }

  function renderAll(){
    renderSeasonSelect();
    renderHero();
    renderStats();
    renderStandings();
    renderFeed();
  }

  const configFilledIn = firebaseConfig.apiKey && firebaseConfig.apiKey !== "VUL_HIER_IN";
  if(configFilledIn){
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    onSnapshot(collection(db,"players"), snap=>{
      data.players = snap.docs.map(d=>({ id:d.id, ...d.data() }));
      renderAll();
    });
    onSnapshot(collection(db,"entries"), snap=>{
      data.entries = snap.docs.map(d=>({ date:d.id, ...d.data() }));
      renderAll();
    });
  }

  renderAll();
})();
</script>
</body>
</html>
